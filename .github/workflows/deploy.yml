name: Verify and publish Schoolmanager
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolmanager-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          APP_BASE: /schoolmanager/
      - name: Prevent publishing user PDFs and credentials
        run: node scripts/privacy-gate.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Check Pages configuration
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages(context.repo);
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status !== 404 && error.status !== 403) throw error;
              core.setOutput('enabled', 'false');
              core.warning('Enable Settings > Pages > Source: GitHub Actions, then re-run this workflow.');
            }
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
